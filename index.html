<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON DASH 2026</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }

        #gameCanvas {
            border: 2px solid #00f2ff;
            box-shadow: 0 0 20px #00f2ff55;
            background-color: #000;
            max-width: 100%;
            max-height: 100%;
        }

        .ui {
            position: absolute;
            top: 20px;
            text-align: center;
            pointer-events: none;
            width: 100%;
        }

        #score {
            font-size: 40px;
            color: #00f2ff;
            text-shadow: 0 0 10px #00f2ff;
        }

        #best {
            font-size: 18px;
            color: #ff00ea;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        h2 { font-size: 48px; color: #00f2ff; margin: 0; text-shadow: 0 0 20px #00f2ff; }
        p { font-size: 18px; margin: 20px 0; color: #ccc; }
        button {
            padding: 15px 40px;
            font-size: 24px;
            background: transparent;
            color: #00f2ff;
            border: 2px solid #00f2ff;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        button:hover { background: #00f2ff; color: #000; box-shadow: 0 0 30px #00f2ff; }
    </style>
</head>
<body>

    <div class="ui">
        <div id="score">0</div>
        <div id="best">РЕКОРД: 0</div>
    </div>

    <div id="startMenu" class="overlay">
        <h2>NEON DASH</h2>
        <p>Кликай, чтобы менять гравитацию</p>
        <button onclick="startGame()">ИГРАТЬ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const startMenu = document.getElementById('startMenu');

        // Настройки экрана
        canvas.width = 800;
        canvas.height = 400;

        let gameActive = false;
        let score = 0;
        let bestScore = localStorage.getItem('neonBest') || 0;
        bestEl.innerText = `РЕКОРД: ${bestScore}`;

        // Параметры игрока
        const player = {
            x: 100,
            y: 350,
            size: 30,
            onCeiling: false,
            targetY: 350,
            speedY: 15,
            color: '#00f2ff'
        };

        let obstacles = [];
        let gameSpeed = 5;
        let frameCount = 0;
        let particles = [];

        // Управление
        function handleInput() {
            if (!gameActive) return;
            player.onCeiling = !player.onCeiling;
            player.targetY = player.onCeiling ? 20 : canvas.height - player.size - 20;
        }

        window.addEventListener('keydown', (e) => { if(e.code === 'Space') handleInput(); });
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(); });

        function startGame() {
            gameActive = true;
            startMenu.style.display = 'none';
            score = 0;
            gameSpeed = 6;
            obstacles = [];
            particles = [];
            player.onCeiling = false;
            player.y = canvas.height - player.size - 20;
            player.targetY = player.y;
            animate();
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    size: Math.random() * 5,
                    life: 1,
                    color: color
                });
            }
        }

        function spawnObstacle() {
            const isTop = Math.random() > 0.5;
            const h = 40 + Math.random() * 60;
            obstacles.push({
                x: canvas.width,
                y: isTop ? 0 : canvas.height - h,
                w: 30,
                h: h,
                color: '#ff00ea'
            });
        }

        function gameOver() {
            gameActive = false;
            createParticles(player.x + player.size/2, player.y + player.size/2, '#fff');
            if (score > bestScore) {
                bestScore = Math.floor(score);
                localStorage.setItem('neonBest', bestScore);
                bestEl.innerText = `РЕКОРД: ${bestScore}`;
            }
            setTimeout(() => {
                startMenu.style.display = 'flex';
                startMenu.querySelector('h2').innerText = "БАБАХ!";
            }, 500);
        }

        function animate() {
            if (!gameActive) {
                // Рисуем частицы даже после смерти
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                updateParticles();
                if(particles.length > 0) requestAnimationFrame(animate);
                return;
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; // Эффект шлейфа
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Движение игрока (плавный переход)
            const dy = player.targetY - player.y;
            player.y += dy * 0.2;

            // Отрисовка игрока
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.shadowBlur = 0;

            // Работа с препятствиями
            if (frameCount % Math.max(20, Math.floor(80 - gameSpeed)) === 0) spawnObstacle();
            
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.x -= gameSpeed;

                ctx.shadowBlur = 10;
                ctx.shadowColor = o.color;
                ctx.fillStyle = o.color;
                ctx.fillRect(o.x, o.y, o.w, o.h);

                // Коллизия
                if (player.x < o.x + o.w &&
                    player.x + player.size > o.x &&
                    player.y < o.y + o.h &&
                    player.y + player.size > o.y) {
                    gameOver();
                }

                if (o.x + o.w < 0) obstacles.splice(i, 1);
            }

            updateParticles();

            score += 0.1;
            gameSpeed += 0.001;
            scoreEl.innerText = Math.floor(score);
            frameCount++;

            requestAnimationFrame(animate);
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                ctx.fillStyle = `rgba(${p.color === '#ff00ea' ? '255,0,234' : '0,242,255'}, ${p.life})`;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.life <= 0) particles.splice(i, 1);
            }
        }
    </script>
</body>
</html>
