<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON DASH 2026</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 2 / 1;
            border: 2px solid #00f2ff;
            box-shadow: 0 0 15px #00f2ff;
            background-color: #1a002c;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Общие стили для экранов интерфейса */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 5, 0.9);
            z-index: 10;
        }

        h2 {
            font-size: 32px;
            color: #00f2ff;
            text-shadow: 0 0 10px #00f2ff;
            margin: 10px 0;
            text-transform: uppercase;
        }

        p {
            font-size: 14px;
            color: #ccc;
            margin: 5px 0 15px 0;
        }

        /* Кнопки */
        .btn {
            background: none;
            border: 2px solid #00f2ff;
            color: #00f2ff;
            padding: 10px 30px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 0 8px #00f2ff;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn:active {
            background-color: #00f2ff;
            color: #050505;
            box-shadow: 0 0 20px #00f2ff;
        }

        /* Счётчики в игре */
        #hud {
            position: absolute;
            top: 10px;
            left: 0;            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }

        #scoreVal {
            font-size: 36px;
            color: #00f2ff;
            text-shadow: 0 0 8px #00f2ff;
        }

        #bestVal {
            font-size: 14px;
            color: #ff00ea;
            text-shadow: 0 0 5px #ff00ea;
        }

        /* Настройки */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 250px;
            margin: 10px 0;
            font-size: 18px;
        }

        .toggle-btn {
            border: 2px solid #ff00ea;
            color: #ff00ea;
            box-shadow: 0 0 8px #ff00ea;
        }

        .toggle-btn.off {
            border-color: #555;
            color: #555;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Игровой интерфейс (Счет) -->
        <div id="hud">
            <div id="scoreVal">0</div>
            <div id="bestVal">РЕКОРД: 0</div>
        </div>

        <canvas id="gameCanvas" width="600" height="300"></canvas>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="startMenu" class="menu-screen">
            <h2>NEON DASH</h2>
            <p>Кликай, чтобы менять гравитацию</p>
            <button class="btn" id="playBtn">ИГРАТЬ</button>
            <button class="btn" id="settingsBtn">НАСТРОЙКИ</button>
            <button class="btn" id="recordsBtn">РЕКОРДЫ</button>
        </div>

        <!-- НАСТРОЙКИ -->
        <div id="settingsMenu" class="menu-screen" style="display: none;">
            <h2>НАСТРОЙКИ</h2>
            <div class="setting-row">
                <span>ЗВУК:</span>
                <button class="btn toggle-btn" id="soundToggle">ВКЛ</button>
            </div>
            <div class="setting-row">
                <span>МУЗЫКА:</span>
                <button class="btn toggle-btn" id="musicToggle">ВКЛ</button>
            </div>
            <button class="btn" id="backFromSettingsBtn">НАЗАД</button>
        </div>

        <!-- РЕКОРДЫ -->
        <div id="recordsMenu" class="menu-screen" style="display: none;">
            <h2>РЕКОРДЫ</h2>
            <p style="font-size: 18px; color: #ff00ea; text-shadow: 0 0 5px #ff00ea;">
                ВАШ ЛУЧШИЙ РЕЗУЛЬТАТ: <span id="recordVal">0</span>
            </p>
            <button class="btn" id="backFromRecordsBtn">НАЗАД</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startMenu = document.getElementById('startMenu');
        const settingsMenu = document.getElementById('settingsMenu');
        const recordsMenu = document.getElementById('recordsMenu');

        const scoreEl = document.getElementById('scoreVal');
        const bestEl = document.getElementById('bestVal');
        const recordValEl = document.getElementById('recordVal');

        // Кнопки навигации
        const playBtn = document.getElementById('playBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const recordsBtn = document.getElementById('recordsBtn');
        const backFromSettingsBtn = document.getElementById('backFromSettingsBtn');
        const backFromRecordsBtn = document.getElementById('backFromRecordsBtn');

        // Кнопки настроек
        const soundToggle = document.getElementById('soundToggle');
        const musicToggle = document.getElementById('musicToggle');

        let gameActive = false;
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('neonBest')) || 0;let gameSpeed = 5;
        let frameCount = 0;

        const player = {
            x: 80,
            y: 200,
            size: 24,
            targetY: 200,
            color: '#00f2ff'
        };

        let obstacles = [];
        let particles = [];
        let isTop = false;

        // Состояния настроек
        let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';
        let musicEnabled = localStorage.getItem('musicEnabled') !== 'false';

        // Инициализация интерфейса
        bestEl.innerText = `РЕКОРД: ${bestScore}`;
        recordValEl.innerText = bestScore;
        updateSettingsUI();

        // Обработка переходов меню
        playBtn.addEventListener('click', startGame);
        
        settingsBtn.addEventListener('click', () => {
            startMenu.style.display = 'none';
            settingsMenu.style.display = 'flex';
        });

        recordsBtn.addEventListener('click', () => {
            startMenu.style.display = 'none';
            recordsMenu.style.display = 'flex';
            recordValEl.innerText = bestScore;
        });

        backFromSettingsBtn.addEventListener('click', () => {
            settingsMenu.style.display = 'none';
            startMenu.style.display = 'flex';
        });

        backFromRecordsBtn.addEventListener('click', () => {
            recordsMenu.style.display = 'none';
            startMenu.style.display = 'flex';
        });

        // Включение/выключение звуков
        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem('soundEnabled', soundEnabled);
            updateSettingsUI();
        });

        musicToggle.addEventListener('click', () => {
            musicEnabled = !musicEnabled;
            localStorage.setItem('musicEnabled', musicEnabled);
            updateSettingsUI();
        });

        function updateSettingsUI() {
            soundToggle.innerText = soundEnabled ? 'ВКЛ' : 'ВЫКЛ';
            soundToggle.className = soundEnabled ? 'btn toggle-btn' : 'btn toggle-btn off';
            musicToggle.innerText = musicEnabled ? 'ВКЛ' : 'ВЫКЛ';
            musicToggle.className = musicEnabled ? 'btn toggle-btn' : 'btn toggle-btn off';
        }

        // Клик по экрану/холсту для прыжка
        function handleJump() {
            if (!gameActive) return;
            isTop = !isTop;
            player.targetY = isTop ? 20 : canvas.height - player.size - 20;
            createParticles(player.x + player.size/2, player.y + player.size/2, player.color);
        }

        canvas.addEventListener('mousedown', handleJump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleJump();
        });

        function startGame() {
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            particles = [];
            gameActive = true;
            startMenu.style.display = 'none';
            isTop = false;
            player.y = canvas.height - player.size - 20;
            player.targetY = player.y;
            frameCount = 0;
            animate();
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    size: Math.random() * 5,
                    life: 1,
                    color: color
                });
            }
        }

        function spawnObstacle() {
            const isObstacleTop = Math.random() > 0.5;
            const h = 40 + Math.random() * 60;
            obstacles.push({
                x: canvas.width,
                y: isObstacleTop ? 0 : canvas.height - h,
                w: 30,
                h: h,
                color: '#ff00ea'
            });
        }

        function gameOver() {
            gameActive = false;
            createParticles(player.x + player.size/2, player.y + player.size/2, '#fff');
            if (score > bestScore) {
                bestScore = Math.floor(score);
                localStorage.setItem('neonBest', bestScore);
                bestEl.innerText = `РЕКОРД: ${bestScore}`;
            }
            setTimeout(() => {
                startMenu.style.display = 'flex';
                startMenu.querySelector('h2').innerText = "БАБАХ!";
                playBtn.innerText = "ИГРАТЬ СНОВА";
            }, 500);
        }

        function animate() {
            if (!gameActive) {
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                updateParticles();
                if(particles.length > 0) requestAnimationFrame(animate);
                return;
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; // Эффект шлейфа
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Движение игрока (плавный переход)
            const dy = player.targetY - player.y;
            player.y += dy * 0.2;

            // Отрисовка игрока
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.shadowBlur = 0;

            // Работа с препятствиями
            if (frameCount % Math.max(20, Math.floor(80 - gameSpeed)) === 0) spawnObstacle();
            
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.x -= gameSpeed;

                ctx.shadowBlur = 10;
                ctx.shadowColor = o.color;
                ctx.fillStyle = o.color;
                ctx.fillRect(o.x, o.y, o.w, o.h);

                // Коллизия
                if (player.x < o.x + o.w &&
                    player.x + player.size > o.x &&
                    player.y < o.y + o.h &&
                    player.y + player.size > o.y) {
                    gameOver();
                }

                if (o.x + o.w < 0) obstacles.splice(i, 1);
            }

            updateParticles();

            score += 0.1;
            gameSpeed += 0.001;
            scoreEl.innerText = Math.floor(score);
            frameCount++;

            requestAnimationFrame(animate);
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                ctx.fillStyle = `rgba(${p.color === '#ff00ea' ? '255,0,234' : '0,242,255'}, ${p.life})`;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.life <= 0) particles.splice(i, 1);
            }
        }
    </script>
</body>
</html>
