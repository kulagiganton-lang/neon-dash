<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON DASH: EVOLUTION</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #050505; color: #fff;
            font-family: 'Courier New', Courier, monospace; overflow: hidden;
            display: flex; align-items: center; justify-content: center; height: 100vh;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        #game-container {
            position: relative; width: 100%; max-width: 600px; aspect-ratio: 2 / 1;
            border: 3px solid #00f2ff; transition: border-color 0.5s, box-shadow 0.5s;
            box-shadow: 0 0 20px #00f2ff; background-color: #000; overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(5, 5, 5, 0.95); z-index: 10;
        }
        h2 { font-size: 32px; color: #00f2ff; text-shadow: 0 0 15px #00f2ff; margin: 5px 0; text-align: center; }
        .btn {
            background: transparent; border: 2px solid #00f2ff; color: #00f2ff;
            padding: 8px 20px; font-size: 15px; font-family: inherit; font-weight: bold;
            cursor: pointer; margin: 4px; transition: 0.2s;
        }
        .btn:active { background-color: #00f2ff; color: #050505; }
        #hud {
            position: absolute; top: 8px; left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 5;
        }
        #scoreVal { font-size: 32px; color: #00f2ff; text-shadow: 0 0 8px #00f2ff; }
        #stageName { font-size: 14px; color: #fff; background: rgba(255,255,255,0.1); padding: 2px 10px; border-radius: 10px; margin-top: 5px; }
        #skinsList { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 5px; max-height: 200px; overflow-y: auto; }
        .skin-card {
            width: 80px; height: 80px; margin: 5px; border: 2px solid #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 9px; font-weight: bold; cursor: pointer; border-radius: 8px; position: relative;
        }        .skin-card.locked { filter: grayscale(1) brightness(0.5); cursor: not-allowed; }
        .skin-card.selected { border-color: #FFD700; box-shadow: 0 0 15px #FFD700; }
        .lock-icon { position: absolute; font-size: 20px; bottom: 5px; }
        #rage-bar { position: absolute; bottom: 0; left: 0; height: 5px; width: 0%; background: #00FF66; z-index: 6; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div id="scoreVal">0</div>
            <div id="stageName">ЭТАП 1: НЕОН</div>
            <div style="color:#FFD700; font-size:12px; margin-top:3px;">МОНЕТЫ: <span id="coinsHUD">0</span></div>
        </div>
        <div id="rage-bar"></div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div id="startMenu" class="menu-screen">
            <h2 id="menuTitle">NEON DASH 2.0</h2>
            <div id="menuStats" style="color:#FFD700; margin-bottom:10px;">РЕКОРД: <span id="bestMenu">0</span> | МОНЕТЫ: <span id="coinsMenu">0</span></div>
            <button class="btn" id="playBtn">ИГРАТЬ 🚀</button>
            <button class="btn" id="shopBtn">МАГАЗИН И ДОСТИЖЕНИЯ 🏆</button>
            <button class="btn" id="promoBtn" style="border-color:#ff00ea; color:#ff00ea;">ПРОМОКОД 🔑</button>
        </div>

        <div id="shopMenu" class="menu-screen" style="display: none;">
            <h2>МАГАЗИН</h2>
            <p id="shopTip" style="font-size:11px; color:#aaa;">Некоторые скины требуют рекорд!</p>
            <div id="skinsList"></div>
            <button class="btn" id="backFromShopBtn">НАЗАД</button>
        </div>

        <div id="promoMenu" class="menu-screen" style="display: none;">
            <h2>АКТИВАЦИЯ</h2>
            <input type="text" id="promoInput" style="background:#111; border:2px solid #ff00ea; color:#fff; padding:10px; text-align:center; margin-bottom:10px;" placeholder="КОД...">
            <button class="btn" id="submitPromoBtn">ОК</button>
            <button class="btn" id="backFromPromoBtn">НАЗАД</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreVal');
        const stageEl = document.getElementById('stageName');
        const coinsHUD = document.getElementById('coinsHUD');
        const skinsListEl = document.getElementById('skinsList');
        const rageBar = document.getElementById('rage-bar');

        let gameActive = false, score = 0, frameCount = 0, gameSpeed = 5, currentStage = 1;
        let bestScore = parseInt(localStorage.getItem('neonBest')) || 0;
        let totalCoins = parseInt(localStorage.getItem('neonCoins')) || 0;
        
        const player = { x: 100, y: 350, size: 32, targetY: 350, color: '#00f2ff', type: 'color', emoji: '' };
        let obstacles = [], coins = [], particles = [], floatTexts = [], isTop = false;
        let rageMode = false, rageTimer = 0;

        const skins = [
            { id: 'default', color: '#00f2ff', name: 'НЕОН', req: 0, price: 0, owned: true, type: 'color' },
            { id: 'sigma', color: '#8e8e8e', name: 'СИГМА 🗿', req: 0, price: 20, owned: false, type: 'emoji', emoji: '🗿' },
            { id: 'diamond', color: '#00ffff', name: 'АЛМАЗ 💎', req: 500, price: 0, owned: false, type: 'emoji', emoji: '💎' },
            { id: 'ghost', color: '#ffffff', name: 'ПРИЗРАК 👻', req: 1000, price: 0, owned: false, type: 'emoji', emoji: '👻' },
            { id: 'master', color: 'rainbow', name: 'МАСТЕР 🔥', req: 2000, price: 0, owned: false, type: 'rainbow' }
        ];
        let selectedSkinId = localStorage.getItem('neonSelectedSkin') || 'default';

        function init() {
            document.getElementById('bestMenu').innerText = bestScore;
            document.getElementById('coinsMenu').innerText = totalCoins;
            coinsHUD.innerText = totalCoins;
            skins.forEach(s => { 
                if(localStorage.getItem('skin_'+s.id)) s.owned = true;
                if(s.req > 0 && bestScore >= s.req) s.owned = true; 
            });
            applySkin();
        }

        function applySkin() {
            const s = skins.find(x => x.id === selectedSkinId);
            player.type = s.type; player.color = s.color; player.emoji = s.emoji || '';
        }

        function renderSkins() {
            skinsListEl.innerHTML = '';
            skins.forEach(s => {
                const isLocked = (s.req > bestScore && !s.owned);
                const card = document.createElement('div');
                card.className = `skin-card ${s.id === selectedSkinId ? 'selected' : ''} ${isLocked ? 'locked' : ''}`;
                card.style.background = s.color === 'rainbow' ? 'linear-gradient(45deg, red, blue)' : s.color;
                
                if (isLocked) {
                    card.innerHTML = `<div>${s.name}</div><div class="lock-icon">🔒</div><div style="font-size:7px;margin-top:25px;">РЕКОРД: ${s.req}</div>`;
                } else {
                    card.innerHTML = `<div>${s.name}</div><div>${s.owned ? 'ВЫБРАТЬ' : s.price + '💰'}</div>`;
                    card.onclick = () => {
                        if(s.owned) { selectedSkinId = s.id; localStorage.setItem('neonSelectedSkin', s.id); applySkin(); renderSkins(); }
                        else if(totalCoins >= s.price) { totalCoins -= s.price; s.owned = true; localStorage.setItem('neonCoins', totalCoins); localStorage.setItem('skin_'+s.id, 'true'); renderSkins(); }
                    };
                }
                skinsListEl.appendChild(card);
            });
        }

        document.getElementById('playBtn').onclick = startGame;
        document.getElementById('shopBtn').onclick = () => { document.getElementById('startMenu').style.display='none'; document.getElementById('shopMenu').style.display='flex'; renderSkins(); };
        document.getElementById('backFromShopBtn').onclick = () => { document.getElementById('shopMenu').style.display='none'; document.getElementById('startMenu').style.display='flex'; init(); };
        document.getElementById('promoBtn').onclick = () => { document.getElementById('startMenu').style.display='none'; document.getElementById('promoMenu').style.display='flex'; };
        document.getElementById('backFromPromoBtn').onclick = () => { document.getElementById('promoMenu').style.display='none'; document.getElementById('startMenu').style.display='flex'; };
        
        document.getElementById('submitPromoBtn').onclick = () => {
            const code = document.getElementById('promoInput').value.toUpperCase();
            if(code === 'KULAGIN' && !localStorage.getItem('p_k')) { totalCoins+=500; localStorage.setItem('p_k','1'); localStorage.setItem('neonCoins', totalCoins); alert('ГЕЙМДИЗАЙНЕР ДАЛ ВАМ 500 МОНЕТ!'); }
            document.getElementById('promoInput').value = '';
        };

        function startGame() {
            gameActive = true; score = 0; frameCount = 0; gameSpeed = 5; currentStage = 1;
            obstacles = []; coins = []; particles = []; floatTexts = []; isTop = false;
            rageMode = false; rageTimer = 0;
            document.getElementById('startMenu').style.display = 'none';
            player.y = 350; player.targetY = 350;
            animate();
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {particles.push({ x: x, y: y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, size: Math.random()*5+2, life: 1, color: color });
            }
        }

        function spawnObstacle() {
            const h = 40 + Math.random() * 80;
            const isT = Math.random() > 0.5;
            obstacles.push({
                x: canvas.width, y: isT ? 0 : canvas.height - h, w: 35, h: h,
                type: (currentStage === 3 && Math.random() > 0.6) ? 'ghost' : 'normal',
                moving: currentStage >= 2, dir: 1, speed: 1.5 + Math.random()
            });
        }

        function animate() {
            if (!gameActive) return;
            
            // Управление этапами
            if (score < 300) { currentStage = 1; stageEl.innerText = "ЭТАП 1: НЕОН"; document.getElementById('game-container').style.borderColor = "#00f2ff"; }
            else if (score < 800) { currentStage = 2; stageEl.innerText = "ЭТАП 2: СКОРОСТЬ"; document.getElementById('game-container').style.borderColor = "#ff00ea"; }
            else { currentStage = 3; stageEl.innerText = "ЭТАП 3: ГЛЮК"; document.getElementById('game-container').style.borderColor = "#ff0000"; }

            ctx.fillStyle = rageMode ? `rgba(${Math.random()*40},0,0,0.3)` : 'rgba(0,0,0,0.2)';
            ctx.fillRect(0,0,canvas.width,canvas.height);

            if(rageMode) { rageTimer--; rageBar.style.width = (rageTimer/300*100)+'%'; if(rageTimer<=0) rageMode=false; }

            player.y += (player.targetY - player.y) * 0.2;
            ctx.shadowBlur = 15;
            if (player.type === 'rainbow') player.color = `hsl(${frameCount%360}, 100%, 50%)`;
            ctx.shadowColor = player.color === 'rainbow' ? '#fff' : player.color;
            
            if(player.type === 'emoji') { ctx.font = "34px Arial"; ctx.fillText(player.emoji, player.x, player.y + 28); }
            else { ctx.fillStyle = player.color; ctx.fillRect(player.x, player.y, player.size, player.size); }
            ctx.shadowBlur = 0;

            if (frameCount % Math.max(20, 80 - Math.floor(gameSpeed*2)) === 0) spawnObstacle();
            if (frameCount % 100 === 0) coins.push({x: canvas.width, y: 50+Math.random()*300, isS: Math.random()>0.9});

            obstacles.forEach((o, i) => {
                o.x -= gameSpeed;
                if(o.moving) { o.y += o.dir * o.speed; if(o.y<=0 || o.y+o.h >= canvas.height) o.dir *= -1; }
                
                let alpha = 1;
                if(o.type === 'ghost') alpha = Math.abs(Math.sin(frameCount/20));
                
                ctx.globalAlpha = alpha;
                ctx.fillStyle = currentStage === 3 ? '#ff0000' : '#ff00ea';
                ctx.fillRect(o.x, o.y, o.w, o.h);
                ctx.globalAlpha = 1;

                if (alpha > 0.5 && player.x < o.x + o.w && player.x + player.size > o.x && player.y < o.y + o.h && player.y + player.size > o.y) {
                    if(!rageMode) { gameActive=false; setTimeout(()=> { document.getElementById('startMenu').style.display='flex'; document.getElementById('menuTitle').innerText="ПОТРАЧЕНО"; init(); }, 500); }
                }
                if (o.x + o.w < 0) obstacles.splice(i, 1);
            });

            coins.forEach((c, i) => {
                c.x -= gameSpeed;
                ctx.font = "20px Arial"; ctx.fillText(c.isS ? "⭐" : "💰", c.x, c.y);
                if (Math.hypot(player.x - c.x, player.y - c.y) < 30) {
                    if(c.isS) { rageMode=true; rageTimer=300; }
                    else { totalCoins++; localStorage.setItem('neonCoins', totalCoins); coinsHUD.innerText=totalCoins; }coins.splice(i, 1);
                }
            });

            particles.forEach((p, i) => { p.x+=p.vx; p.y+=p.vy; p.life-=0.02; ctx.fillStyle=p.color; ctx.globalAlpha=p.life; ctx.fillRect(p.x,p.y,p.size,p.size); if(p.life<=0) particles.splice(i,1); });
            ctx.globalAlpha = 1;

            score += 0.1; gameSpeed += 0.0015; frameCount++;
            scoreEl.innerText = Math.floor(score);
            if (gameActive) requestAnimationFrame(animate);
        }

        canvas.onmousedown = () => { isTop=!isTop; player.targetY = isTop ? 20 : 350; createParticles(player.x, player.y, player.color, 5); };
        canvas.ontouchstart = (e) => { e.preventDefault(); canvas.onmousedown(); };
        init();
    </script>
</body>
</html>
